name: demo-issue
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  file:
    runs-on: ubuntu-latest
    steps:
      - name: File demo issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Add a sandbox note to README" \
            --body "Append one line to README.md: \`This repository is a sandbox for dsh-superagent.\` Then open a pull request."
